<svg width="1440" height="810" viewBox="0 0 1440 810" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="810" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7C3AED"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4F46E5"/><stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <style>
      .title{font:800 44px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}.sub{font:500 20px Inter,Segoe UI,Arial,sans-serif;fill:#64748B}.h{font:800 28px Inter,Segoe UI,Arial,sans-serif;fill:#111827}.label{font:700 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.metric{font:800 42px Inter,Segoe UI,Arial,sans-serif}.body{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#334155}.small{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748B}.num{font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#5B21B6}.axis{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#64748B}
    </style>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <text x="720" y="64" text-anchor="middle" class="title">From Headline Accuracy to Reward Audit</text>
  <text x="720" y="98" text-anchor="middle" class="sub">Why 91.35% pairwise accuracy was not the end of the story</text>
  <rect x="38" y="140" width="392" height="540" rx="24" fill="#FFF7F7" stroke="#FCA5A5" stroke-width="2"/>
  <circle cx="82" cy="182" r="28" fill="#C2415A"/><text x="82" y="191" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="white">1</text>
  <text x="126" y="191" class="h">Shortcut Warning</text>
  <text x="72" y="252" class="label">Fine-tuned RM</text>
  <text x="72" y="303" class="metric" fill="#6D28D9">91.35%</text>
  <rect x="72" y="320" width="310" height="16" rx="8" fill="#E2E8F0"/><rect x="72" y="320" width="283" height="16" rx="8" fill="url(#purple)"/>
  <text x="72" y="387" class="label">Longer-response heuristic</text>
  <text x="72" y="438" class="metric" fill="#EF4444">94.61%</text>
  <rect x="72" y="455" width="310" height="16" rx="8" fill="#E2E8F0"/><rect x="72" y="455" width="293" height="16" rx="8" fill="#EF4444"/>
  <path d="M72 512H394" stroke="#FECACA" stroke-width="2"/>
  <path d="M86 590L111 546L136 590H86Z" fill="none" stroke="#EF4444" stroke-width="7" stroke-linejoin="round"/><text x="111" y="579" text-anchor="middle" font-family="Arial" font-size="26" font-weight="800" fill="#EF4444">!</text>
  <text x="160" y="554" class="body">A trivial length-based rule</text><text x="160" y="582" class="body">outperformed the IID headline metric.</text>
  <text x="72" y="642" class="small">Question raised:</text><text x="72" y="665" class="body">Did the model learn preference —</text><text x="72" y="689" class="body">or a shortcut correlated with it?</text>
  <path d="M446 408H482" stroke="#8B5CF6" stroke-width="10" stroke-linecap="round"/><path d="M470 388L493 408L470 428" fill="none" stroke="#8B5CF6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="505" y="140" width="430" height="540" rx="24" fill="#FAF8FF" stroke="#C4B5FD" stroke-width="2"/>
  <circle cx="550" cy="182" r="28" fill="#6D28D9"/><text x="550" y="191" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="white">2</text>
  <text x="594" y="191" class="h">Controlled Challenges</text>
  <rect x="530" y="228" width="180" height="320" rx="16" fill="white" stroke="#DDD6FE"/>
  <text x="620" y="260" text-anchor="middle" class="label">Length-Matched</text><text x="620" y="282" text-anchor="middle" class="small">Control for response length</text>
  <path d="M560 486V324H687" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="560" y1="365" x2="687" y2="365" stroke="#E2E8F0"/><line x1="560" y1="405" x2="687" y2="405" stroke="#E2E8F0"/><line x1="560" y1="445" x2="687" y2="445" stroke="#E2E8F0"/>
  <rect x="580" y="406" width="38" height="80" rx="5" fill="#94A3B8"/><rect x="635" y="362" width="38" height="124" rx="5" fill="#7C3AED"/>
  <text x="599" y="397" text-anchor="middle" class="num" fill="#334155">49.56%</text><text x="654" y="353" text-anchor="middle" class="num">77.78%</text>
  <text x="599" y="514" text-anchor="middle" class="axis">Base</text><text x="654" y="514" text-anchor="middle" class="axis">Fine-tuned</text>
  <rect x="728" y="228" width="180" height="320" rx="16" fill="white" stroke="#DDD6FE"/>
  <text x="818" y="260" text-anchor="middle" class="label">Reversed-Length</text><text x="818" y="282" text-anchor="middle" class="small">Prefer shorter responses</text>
  <path d="M758 486V324H885" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="758" y1="365" x2="885" y2="365" stroke="#E2E8F0"/><line x1="758" y1="405" x2="885" y2="405" stroke="#E2E8F0"/><line x1="758" y1="445" x2="885" y2="445" stroke="#E2E8F0"/>
  <rect x="778" y="410" width="38" height="76" rx="5" fill="#94A3B8"/><rect x="833" y="366" width="38" height="120" rx="5" fill="#7C3AED"/>
  <text x="797" y="401" text-anchor="middle" class="num" fill="#334155">47.70%</text><text x="852" y="357" text-anchor="middle" class="num">74.90%</text>
  <text x="797" y="514" text-anchor="middle" class="axis">Base</text><text x="852" y="514" text-anchor="middle" class="axis">Fine-tuned</text>
  <path d="M530 580H910" stroke="#DDD6FE"/>
  <text x="550" y="615" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#5B21B6">Signal survived shortcut control.</text>
  <text x="550" y="645" class="body">The model learned real preference signal,</text><text x="550" y="670" class="body">but still relied partly on shortcut features.</text>
  <path d="M950 408H986" stroke="#8B5CF6" stroke-width="10" stroke-linecap="round"/><path d="M974 388L997 408L974 428" fill="none" stroke="#8B5CF6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1010" y="140" width="392" height="540" rx="24" fill="#F8FBFF" stroke="#93C5FD" stroke-width="2"/>
  <circle cx="1054" cy="182" r="28" fill="#4F46E5"/><text x="1054" y="191" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="white">3</text>
  <text x="1098" y="191" class="h">Ranking Audit</text>
  <rect x="1035" y="228" width="342" height="330" rx="16" fill="white" stroke="#DBEAFE"/>
  <text x="1060" y="272" class="label">Kendall τ</text><text x="1348" y="272" text-anchor="end" class="num">0.8828</text><line x1="1060" y1="291" x2="1352" y2="291" stroke="#E2E8F0"/>
  <text x="1060" y="330" class="label">NDCG@5</text><text x="1348" y="330" text-anchor="end" class="num">0.9474</text><line x1="1060" y1="349" x2="1352" y2="349" stroke="#E2E8F0"/>
  <text x="1060" y="388" class="label">Perfect 5-way ranking</text><text x="1348" y="388" text-anchor="end" class="num">57.87%</text><line x1="1060" y1="407" x2="1352" y2="407" stroke="#E2E8F0"/>
  <text x="1060" y="446" class="label">Level-5 ranked first</text><text x="1348" y="446" text-anchor="end" class="num">63.86%</text><line x1="1060" y1="465" x2="1352" y2="465" stroke="#E2E8F0"/>
  <text x="1060" y="504" class="label">Level-1 ranked last</text><text x="1348" y="504" text-anchor="end" class="num">95.57%</text>
  <text x="1040" y="608" class="body">Pairwise accuracy alone was insufficient.</text>
  <text x="1040" y="635" class="body">Ranking behavior exposed a deeper view</text>
  <text x="1040" y="662" class="body">of reward quality.</text>
  <rect x="38" y="714" width="1364" height="68" rx="20" fill="#F3E8FF" stroke="#C4B5FD"/>
  <text x="70" y="746" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#6D28D9">Research takeaway:</text>
  <text x="270" y="746" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#111827">Train → Attack → Diagnose → Audit.</text>
  <text x="70" y="770" class="small">Reward modeling is not only about improving accuracy, but verifying what the reward function actually learned.</text>
</svg>