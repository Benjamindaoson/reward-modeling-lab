[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reward-modeling-preference-learning"
version = "0.1.0"
description = "An auditable 8B reward-model post-training and preference-learning system with QLoRA, robust evaluation, shortcut auditing, and checkpoint analysis."
requires-python = ">=3.11"

[project.optional-dependencies]
train = [
    "torch",
    "transformers",
    "datasets",
    "accelerate",
    "pandas",
    "pyarrow",
    "safetensors",
    "sentencepiece",
    "peft",
    "bitsandbytes",
    "huggingface_hub",
    "rich"
]

[project.scripts]
reward-modeling = "financial_reward_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
